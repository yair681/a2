<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הארנק הכיתתי</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#194278">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- apple-mobile-web-app-* הם מה שגורם לאייפון לפתוח את האתר במסך מלא
         אחרי "הוספה למסך הבית", ולהציג את השם הקצר מתחת לאייקון. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="הארנק">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        h1 { color: #333; }
        .install-foot { border-top: 1px solid #e4e6eb; margin-top: 22px; padding-top: 18px; }
        .install-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            text-decoration: none; color: #007bff; background: #fff; font-size: 16px;
        }
        .install-link:hover { background: #f7f9fc; }
        .install-hint { color: #888; font-size: 13px; margin: 8px 0 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>הארנק הדיגיטלי 🎓</h1>
        <p>ברוכים הבאים למערכת הפרסים</p>
        
        <input type="password" id="code" placeholder="הכנס את הסיסמה/קוד האישי שלך">
        <button onclick="login()">כניסה</button>
        <p id="error" style="color:red;"></p>

        <div class="install-foot">
            <a class="install-link" href="/install.html">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="6" y="2" width="12" height="20" rx="2.6" stroke="currentColor" stroke-width="1.8"></rect>
                    <path d="M12 8v7m0 0l-2.6-2.6M12 15l2.6-2.6" stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                התקנת האפליקציה בטלפון
            </a>
            <p class="install-hint">כדי לפתוח את הארנק מהמסך הראשי, בלי להקליד כתובת</p>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // יעד לפי תפקיד. מוגדר פעם אחת ומשרת גם את ההתחברות וגם את הזיהוי
        // האוטומטי — שני עותקים של אותו מיפוי היו נפרדים זה מזה ביום שבו
        // מישהו יוסיף תפקיד.
        const HOME_BY_ROLE = {
            superadmin: 'superadmin.html',
            teacher: 'admin.html',
            student: 'student.html'
        };
        const homeFor = (role) => HOME_BY_ROLE[role] || 'student.html';

        // מי שכבר מחובר לא צריך להקליד את הקוד שוב.
        //
        // 🔴 בלי הבדיקה הזו עוגיית הסשן הארוכה חסרת משמעות: הסשן חי לגמרי,
        // אבל הדף הראשון שנפתח הוא תמיד מסך כניסה — וכך זה נראה למשתמש
        // כאילו הוא מנותק. זה בדיוק מה שקרה ב-07/10/2026: הארכנו את החיבור
        // לשנה, והמשתמש המשיך להתבקש להתחבר, כי אף אחד לא שאל את השרת.
        // replace ולא href, אחרת כפתור "אחורה" מקפיץ בחזרה למסך הכניסה.
        (async () => {
            try {
                const res = await fetch('/api/me', { credentials: 'same-origin' });
                if (!res.ok) return;                  // אין סשן — נשארים כאן
                const me = await res.json();
                if (me && me.role) window.location.replace(homeFor(me.role));
            } catch (error) {
                /* אין רשת — מציגים את מסך הכניסה כרגיל */
            }
        })();

        // ההתחברות מחזירה עוגיית סשן חתומה (httpOnly) שהדפדפן לא יכול לקרוא
        // או לזייף. אין יותר דגלי הרשאה ב-localStorage.
        async function login() {
            const code = document.getElementById('code').value.trim();
            const errorEl = document.getElementById('error');

            if (!code) {
                errorEl.innerText = 'נא להזין סיסמה או קוד';
                return;
            }

            errorEl.innerText = '';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                if (res.status === 429) {
                    errorEl.innerText = 'יותר מדי ניסיונות התחברות. נסה שוב בעוד 15 דקות.';
                    return;
                }

                const data = await res.json();

                if (!data.success) {
                    errorEl.innerText = data.message || 'קוד או סיסמה שגויים';
                    return;
                }

                sessionStorage.clear();
                window.location.href = homeFor(data.role);
            } catch (error) {
                errorEl.innerText = 'שגיאה בחיבור לשרת. נסה שוב.';
            }
        }

        // אפשרות ללחוץ Enter להתחברות
        document.getElementById('code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
