<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול חנות - מורה</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 30px; 
            background-color: #f4f6f9; 
            direction: rtl; 
            color: #333;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }
        .header h2 { 
            color: #17a2b8; 
            margin: 0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background-color: #e9ecef;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab.active {
            background-color: #17a2b8;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            margin-bottom: 20px;
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn { 
            border: none; 
            padding: 10px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary { 
            background-color: #28a745; 
            color: white;
        }
        .btn-primary:hover { 
            background-color: #218838; 
        }
        .btn-danger { 
            background-color: #dc3545; 
            color: white;
        }
        .btn-danger:hover { 
            background-color: #c82333; 
        }
        .btn-success { 
            background-color: #28a745; 
            color: white;
        }
        .btn-reject { 
            background-color: #ffc107; 
            color: #333;
        }
        .btn-info {
            background-color: #17a2b8;
            color: white;
        }
        .product-item, .purchase-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-item:last-child, .purchase-item:last-child {
            border-bottom: none;
        }
        .product-info, .purchase-info {
            flex: 1;
        }
        .product-name, .purchase-product {
            font-weight: bold;
            font-size: 1.1em;
        }
        .product-price, .purchase-price {
            color: #28a745;
            font-weight: bold;
        }
        .stock-info {
            font-size: 0.95em;
            margin-top: 5px;
        }
        .stock-low {
            color: #dc3545;
            font-weight: bold;
        }
        .stock-out {
            color: #dc3545;
            font-weight: bold;
            background-color: #f8d7da;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .stock-ok {
            color: #28a745;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status-pending {
            background-color: #ffc107;
            color: #333;
        }
        .status-approved {
            background-color: #28a745;
            color: white;
        }
        .status-rejected {
            background-color: #dc3545;
            color: white;
        }
        .notification-badge {
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.85em;
            margin-right: 5px;
        }
        .message {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
        }
        .msg-success {
            background-color: #d4edda;
            color: #155724;
        }
        .msg-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .image-preview-box {
            margin-bottom: 15px;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>ניהול חנות הכיתה 🛒</h2>
        <div>
            <button onclick="window.location.href='admin.html'" class="btn" style="background-color: #6c757d; color: white;">חזרה לניהול</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('products')">מוצרים</button>
        <button class="tab" onclick="showTab('pending')">
            בקשות ממתינות
            <span id="pendingCount" class="notification-badge" style="display: none;">0</span>
        </button>
        <button class="tab" onclick="showTab('history')">היסטוריית קניות</button>
    </div>

    <!-- טאב מוצרים -->
    <div id="productsTab" class="tab-content active">
        <div class="card">
            <h3>➕ הוספת מוצר חדש</h3>
            <input type="text" id="productName" placeholder="שם המוצר">
            <input type="number" id="productPrice" placeholder="מחיר בנקודות">
            <input type="number" id="productStock" placeholder="כמות במלאי" value="0">
            <textarea id="productDescription" placeholder="תיאור המוצר (אופציונלי)"></textarea>
            
            <!-- העלאת תמונה -->
            <div class="image-preview-box">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;">📷 תמונת מוצר (אופציונלי):</label>
                <input type="file" id="productImage" accept="image/*" style="margin-bottom: 10px;">
                <div id="imagePreview" style="display: none; margin-top: 15px;">
                    <img id="previewImg" style="max-width: 250px; max-height: 250px; border-radius: 8px; border: 2px solid #17a2b8;">
                    <br>
                    <button class="btn btn-danger" onclick="clearImage()" style="margin-top: 10px;">הסר תמונה</button>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="addProduct()">הוסף מוצר</button>
            <div id="productMessage"></div>
        </div>

        <div class="card">
            <h3>רשימת מוצרים בחנות</h3>
            <div id="productsList"></div>
        </div>
    </div>

    <!-- טאב בקשות ממתינות -->
    <div id="pendingTab" class="tab-content">
        <div class="card">
            <h3>בקשות קניה ממתינות לאישור</h3>
            <div id="pendingList"></div>
        </div>
    </div>

    <!-- טאב היסטוריה -->
    <div id="historyTab" class="tab-content">
        <div class="card">
            <h3>היסטוריית כל הקניות</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- מודל לעדכון מלאי -->
    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">עדכון מלאי</div>
            <div id="stockProductName" style="margin-bottom: 15px; color: #666;"></div>
            <div id="currentStock" style="margin-bottom: 15px; font-weight: bold;"></div>
            <input type="number" id="newStock" placeholder="מלאי חדש" min="0">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeStockModal()">ביטול</button>
                <button class="btn-save" onclick="saveStock()">שמור</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let classId = null;
        let currentEditProductId = null;

        // תצוגה מקדימה של תמונה
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('productImage').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('previewImg').src = event.target.result;
                        document.getElementById('imagePreview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        function clearImage() {
            document.getElementById('productImage').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }

        function showTab(tabName) {
            // הסתרת כל הטאבים
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            // הצגת הטאב הנבחר
            if (tabName === 'products') {
                document.getElementById('productsTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
                loadProducts();
            } else if (tabName === 'pending') {
                document.getElementById('pendingTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
                loadPendingPurchases();
            } else if (tabName === 'history') {
                document.getElementById('historyTab').classList.add('active');
                document.querySelectorAll('.tab')[2].classList.add('active');
                loadPurchaseHistory();
            }
        }

        function showMessage(elementId, message, isSuccess) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = 'message ' + (isSuccess ? 'msg-success' : 'msg-error');
            setTimeout(() => { el.innerHTML = ''; el.className = ''; }, 3000);
        }

        async function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;
            const stock = document.getElementById('productStock').value;
            const description = document.getElementById('productDescription').value.trim();
            const imageFile = document.getElementById('productImage').files[0];

            if (!name || !price) {
                showMessage('productMessage', 'נא למלא שם ומחיר', false);
                return;
            }

            if (price <= 0) {
                showMessage('productMessage', 'המחיר חייב להיות גדול מ-0', false);
                return;
            }

            let imageBase64 = null;
            
            // המרת התמונה ל-Base64 אם קיימת
            if (imageFile) {
                try {
                    imageBase64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(imageFile);
                    });
                } catch (error) {
                    console.error('שגיאה בקריאת התמונה:', error);
                    showMessage('productMessage', 'שגיאה בקריאת התמונה', false);
                    return;
                }
            }

            try {
                const data = await apiPost('/api/products', {
                    name,
                    price: parseInt(price, 10),
                    stock: parseInt(stock, 10) || 0,
                    description,
                    image: imageBase64,
                    classId
                });

                if (data.success) {
                    showMessage('productMessage', data.message, true);
                    document.getElementById('productName').value = '';
                    document.getElementById('productPrice').value = '';
                    document.getElementById('productStock').value = '0';
                    document.getElementById('productDescription').value = '';
                    clearImage();
                    loadProducts();
                } else {
                    showMessage('productMessage', data.message || 'שגיאה בהוספת המוצר', false);
                }
            } catch (error) {
                console.error('שגיאה בהוספת מוצר:', error);
                showMessage('productMessage', 'שגיאה בחיבור לשרת', false);
            }
        }

        async function loadProducts() {
            const products = await apiJson(`/api/products/${classId}`);
            const list = document.getElementById('productsList');

            if (products.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d;">אין עדיין מוצרים בחנות</p>';
                return;
            }

            list.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-item';
                
                let imageHTML = '';
                if (typeof p.image === 'string' && p.image.startsWith('data:image/')) {
                    imageHTML = `<img src="${esc(p.image)}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-left: 15px;">`;
                }
                
                let stockClass = 'stock-ok';
                let stockText = `מלאי: ${p.stock} יחידות`;
                if (p.stock === 0) {
                    stockClass = 'stock-out';
                    stockText = '❌ אזל מהמלאי';
                } else if (p.stock <= 5) {
                    stockClass = 'stock-low';
                    stockText = `⚠️ מלאי נמוך: ${p.stock} יחידות`;
                }
                
                div.innerHTML = `
                    ${imageHTML}
                    <div class="product-info">
                        <div class="product-name">${esc(p.name)}</div>
                        <div>${esc(p.description || '')}</div>
                        <div class="product-price">${esc(p.price)} נקודות</div>
                        <div class="stock-info ${stockClass}">${esc(stockText)}</div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <button class="btn btn-info">📦 עדכן מלאי</button>
                        <button class="btn btn-danger">מחק</button>
                    </div>
                `;

                const [stockBtn, deleteBtn] = div.querySelectorAll('button');
                stockBtn.onclick = () => openStockModal(p._id, p.name, p.stock);
                deleteBtn.onclick = () => deleteProduct(p._id);

                list.appendChild(div);
            });
        }

        function openStockModal(productId, productName, currentStock) {
            currentEditProductId = productId;
            document.getElementById('stockProductName').textContent = `מוצר: ${productName}`;
            document.getElementById('currentStock').textContent = `מלאי נוכחי: ${currentStock} יחידות`;
            document.getElementById('newStock').value = currentStock;
            document.getElementById('stockModal').style.display = 'block';
        }

        function closeStockModal() {
            document.getElementById('stockModal').style.display = 'none';
            currentEditProductId = null;
        }

        async function saveStock() {
            const newStock = parseInt(document.getElementById('newStock').value, 10);

            if (!Number.isFinite(newStock) || newStock < 0) {
                alert('נא להזין מלאי חוקי');
                return;
            }

            const data = await apiPost(`/api/products/${currentEditProductId}/stock`, { stock: newStock });

            if (data.success) {
                alert(data.message);
                closeStockModal();
                loadProducts();
            } else {
                alert('שגיאה: ' + data.message);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('האם למחוק מוצר זה?')) return;

            const data = await apiJson(`/api/products/${id}`, { method: 'DELETE' });

            if (data.success) {
                loadProducts();
            } else {
                alert(data.message);
            }
        }

        async function loadPendingPurchases() {
            const purchases = await apiJson(`/api/purchases/${classId}`);
            const pending = purchases.filter(p => p.status === 'pending');
            
            // עדכון תג התראה
            const badge = document.getElementById('pendingCount');
            if (pending.length > 0) {
                badge.textContent = pending.length;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }

            const list = document.getElementById('pendingList');

            if (pending.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d;">אין בקשות ממתינות</p>';
                return;
            }

            list.innerHTML = '';

            // רשימת המוצרים נטענת פעם אחת ולא פעם לכל בקשה ממתינה
            const products = await apiJson(`/api/products/${classId}`);

            for (const p of pending) {
                const product = products.find(prod => prod._id === p.productId);

                const div = document.createElement('div');
                div.className = 'purchase-item';

                let stockWarning = '';
                if (product && product.stock <= 0) {
                    stockWarning = '<div style="color: #dc3545; font-weight: bold; margin-top: 5px;">⚠️ המוצר אזל מהמלאי!</div>';
                }

                div.innerHTML = `
                    <div class="purchase-info">
                        <div class="purchase-product">${esc(p.productName)}</div>
                        <div>תלמיד: ${esc(p.studentName)} (${esc(p.studentId)})</div>
                        <div class="purchase-price">מחיר: ${esc(p.price)} נקודות</div>
                        <div style="font-size: 0.9em; color: #6c757d;">
                            תאריך: ${new Date(p.createdAt).toLocaleDateString('he-IL')}
                        </div>
                        ${stockWarning}
                    </div>
                    <div>
                        <button class="btn btn-success" ${product && product.stock <= 0 ? 'disabled' : ''}>✓ אשר</button>
                        <button class="btn btn-reject">✗ דחה</button>
                    </div>
                `;

                const [approveBtn, rejectBtn] = div.querySelectorAll('button');
                approveBtn.onclick = () => approvePurchase(p._id, true);
                rejectBtn.onclick = () => approvePurchase(p._id, false);

                list.appendChild(div);
            }
        }

        async function approvePurchase(id, approve) {
            const data = await apiPost(`/api/purchases/${id}/approve`, { approve });

            if (data.success) {
                alert(data.message);
                loadPendingPurchases();
                loadProducts(); // רענון רשימת המוצרים לעדכון המלאי
            } else {
                alert(data.message);
            }
        }

        async function loadPurchaseHistory() {
            const purchases = await apiJson(`/api/purchases/${classId}`);
            const list = document.getElementById('historyList');

            if (purchases.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d;">אין עדיין קניות</p>';
                return;
            }

            list.innerHTML = '';
            purchases.forEach(p => {
                const div = document.createElement('div');
                div.className = 'purchase-item';
                
                let statusBadge = '';
                if (p.status === 'pending') {
                    statusBadge = '<span class="status-badge status-pending">ממתין</span>';
                } else if (p.status === 'approved') {
                    statusBadge = '<span class="status-badge status-approved">אושר</span>';
                } else if (p.status === 'rejected') {
                    statusBadge = '<span class="status-badge status-rejected">נדחה</span>';
                }

                div.innerHTML = `
                    <div class="purchase-info">
                        <div class="purchase-product">${esc(p.productName)} ${statusBadge}</div>
                        <div>תלמיד: ${esc(p.studentName)} (${esc(p.studentId)})</div>
                        <div class="purchase-price">מחיר: ${esc(p.price)} נקודות</div>
                        <div style="font-size: 0.9em; color: #6c757d;">
                            תאריך בקשה: ${new Date(p.createdAt).toLocaleDateString('he-IL')}
                            ${p.approvedAt ? ' | אושר ב: ' + new Date(p.approvedAt).toLocaleDateString('he-IL') : ''}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        (async function init() {
            const session = await loadSession(['teacher', 'superadmin']);
            if (!session) return;

            if (session.role === 'superadmin') {
                classId = sessionStorage.getItem('activeClassId');
                if (!classId) {
                    window.location.href = 'superadmin.html';
                    return;
                }
            } else {
                classId = session.classId;
            }

            await loadProducts();
            await loadPendingPurchases();
            setInterval(loadPendingPurchases, 30000); // רענון כל 30 שניות
        })();
    </script>
</body>
</html>
