<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול פרסים כיתתיים</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 30px; 
            background-color: #f4f6f9; 
            direction: rtl; 
            color: #333;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }
        .header h2 { 
            color: #007bff; 
            margin: 0;
        }
        .class-info {
            font-size: 1.1em;
            color: #666;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        
        input:not([type="button"]), textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .btn-primary { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background-color 0.3s;
            width: 100%;
        }
        .btn-primary:hover { 
            background-color: #218838; 
        }

        .reward-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-right: 5px solid #007bff;
        }
        .reward-card.completed {
            border-right-color: #28a745;
            background-color: #f0f9f4;
        }
        .reward-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .reward-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        .reward-description {
            color: #666;
            margin-bottom: 15px;
        }
        .progress-container {
            margin: 15px 0;
        }
        .progress-bar-bg {
            background-color: #e9ecef;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            background: linear-gradient(90deg, #007bff, #0056b3);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .progress-bar.completed {
            background: linear-gradient(90deg, #28a745, #1e7e34);
        }
        .progress-text {
            margin-top: 5px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
        .reward-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .reward-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-edit {
            background-color: #17a2b8;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn-edit:hover {
            background-color: #138496;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .completed-badge {
            background-color: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .stats {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-buttons button {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .msg-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .msg-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>ניהול פרסים כיתתיים 🏆</h2>
            <div class="class-info">כיתה: <span id="className"></span></div>
        </div>
        <div class="header-buttons">
            <button onclick="window.location.href='admin.html'" style="background-color: #17a2b8;">ניהול תלמידים</button>
            <button onclick="window.location.href='shop-admin.html'" style="background-color: #ffc107; color: #333;">ניהול חנות</button>
            <button id="backBtn" onclick="backToSuperadmin()" style="background-color: #6c757d; display: none;">חזרה</button>
            <button onclick="logout()" style="background-color: #dc3545;">יציאה</button>
        </div>
    </div>

    <div class="content-grid">
        <div class="card">
            <h3>⚡ יצירת פרס חדש</h3>
            <input type="text" id="rewardName" placeholder="שם הפרס (למשל: יום כיף בבריכה)" required>
            <textarea id="rewardDescription" placeholder="תיאור הפרס (אופציונלי)"></textarea>
            <input type="number" id="rewardTarget" placeholder="יעד נקודות לפרס" required min="1">
            <button class="btn-primary" onclick="createReward()">צור פרס</button>
            <div id="message"></div>
        </div>

        <div class="card">
            <h3>רשימת פרסים</h3>
            <div id="rewardsList"></div>
            <div id="loading" style="text-align: center;">טוען נתונים...</div>
        </div>
    </div>

    <!-- מודל לעריכת פרס -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">עריכת פרס</div>
            <input type="text" id="editRewardName" placeholder="שם הפרס">
            <textarea id="editRewardDescription" placeholder="תיאור הפרס"></textarea>
            <input type="number" id="editRewardTarget" placeholder="יעד נקודות" min="1">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">ביטול</button>
                <button class="btn-save" onclick="saveReward()">שמור</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let classId = null;
        let currentEditRewardId = null;

        function backToSuperadmin() {
            sessionStorage.removeItem('activeClassId');
            sessionStorage.removeItem('activeClassName');
            window.location.href = 'superadmin.html';
        }

        function showMessage(message, isSuccess) {
            const el = document.getElementById('message');
            el.innerHTML = message;
            el.className = isSuccess ? 'msg-success' : 'msg-error';
            setTimeout(() => { el.innerHTML = ''; el.className = ''; }, 3000);
        }

        async function createReward() {
            const name = document.getElementById('rewardName').value;
            const description = document.getElementById('rewardDescription').value;
            const targetAmount = document.getElementById('rewardTarget').value;
            
            if (!name || !targetAmount) {
                showMessage('נא למלא שם פרס ויעד נקודות', false);
                return;
            }

            const data = await apiPost('/api/rewards', { name, description, targetAmount, classId });

            if (data.success) {
                showMessage(data.message, true);
                document.getElementById('rewardName').value = '';
                document.getElementById('rewardDescription').value = '';
                document.getElementById('rewardTarget').value = '';
                loadRewards();
            } else {
                showMessage(data.message, false);
            }
        }

        async function loadRewards() {
            document.getElementById('loading').style.display = 'block';
            const rewards = await apiJson(`/api/rewards/class/${classId}`);
            const list = document.getElementById('rewardsList');
            list.innerHTML = '';
            document.getElementById('loading').style.display = 'none';

            if (rewards.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d;">עדיין אין פרסים במערכת.</p>';
                return;
            }

            for (const reward of rewards) {
                const stats = await apiJson(`/api/rewards/${reward._id}/stats`);

                const percentage = Math.min(100, (reward.currentAmount / reward.targetAmount) * 100);
                
                const div = document.createElement('div');
                div.className = `reward-card ${reward.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <div class="reward-header">
                        <div class="reward-title">${esc(reward.name)}</div>
                        ${reward.completed ? '<div class="completed-badge">✓ הושג!</div>' : ''}
                    </div>
                    ${reward.description ? `<div class="reward-description">${esc(reward.description)}</div>` : ''}
                    <div class="progress-container">
                        <div class="progress-bar-bg">
                            <div class="progress-bar ${reward.completed ? 'completed' : ''}" style="width: ${percentage}%">
                                ${percentage.toFixed(0)}%
                            </div>
                        </div>
                        <div class="progress-text">
                            ${reward.currentAmount.toLocaleString('he-IL')} / ${reward.targetAmount.toLocaleString('he-IL')} נקודות
                        </div>
                    </div>
                    <div class="stats">
                        📊 סך תרומות: ${stats.totalContributions} | סך נקודות שנתרמו: ${stats.totalAmount.toLocaleString('he-IL')}
                    </div>
                    <div class="reward-actions">
                        <button class="btn-edit">✏️ ערוך</button>
                        <button class="btn-delete">🗑️ מחק</button>
                    </div>
                `;

                const [editBtn, deleteBtn] = div.querySelectorAll('.reward-actions button');
                editBtn.onclick = () => openEditModal(reward._id, reward.name, reward.description || '', reward.targetAmount);
                deleteBtn.onclick = () => deleteReward(reward._id, reward.name);

                list.appendChild(div);
            }
        }

        function openEditModal(id, name, description, target) {
            currentEditRewardId = id;
            document.getElementById('editRewardName').value = name;
            document.getElementById('editRewardDescription').value = description;
            document.getElementById('editRewardTarget').value = target;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditRewardId = null;
        }

        async function saveReward() {
            const name = document.getElementById('editRewardName').value;
            const description = document.getElementById('editRewardDescription').value;
            const targetAmount = document.getElementById('editRewardTarget').value;
            
            if (!name || !targetAmount) {
                alert('נא למלא שם פרס ויעד נקודות');
                return;
            }

            const data = await apiJson(`/api/rewards/${currentEditRewardId}`, {
                method: 'PUT',
                body: JSON.stringify({ name, description, targetAmount })
            });

            if (data.success) {
                closeEditModal();
                loadRewards();
            } else {
                alert('שגיאה בעדכון הפרס: ' + data.message);
            }
        }

        async function deleteReward(id, name) {
            if (!confirm(`האם אתה בטוח שברצונך למחוק את הפרס "${name}"?\n\nפעולה זו תמחק גם את כל התרומות לפרס ולא ניתן לבטל אותה!`)) {
                return;
            }

            const data = await apiJson(`/api/rewards/${id}`, { method: 'DELETE' });

            if (data.success) {
                alert(data.message);
                loadRewards();
            } else {
                alert('שגיאה: ' + data.message);
            }
        }

        (async function init() {
            const session = await loadSession(['teacher', 'superadmin']);
            if (!session) return;

            if (session.role === 'superadmin') {
                classId = sessionStorage.getItem('activeClassId');
                if (!classId) {
                    window.location.href = 'superadmin.html';
                    return;
                }
                document.getElementById('className').textContent = sessionStorage.getItem('activeClassName') || '';
                document.getElementById('backBtn').style.display = 'inline-block';
            } else {
                classId = session.classId;
                document.getElementById('className').textContent = session.className || '';
            }

            loadRewards();
        })();
    </script>
</body>
</html>
