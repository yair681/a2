<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול כיתה - מרכז בקרה</title>
    <style>
        /* CSS לעיצוב נקי ומודרני */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 30px; 
            background-color: #f4f6f9; 
            direction: rtl; 
            color: #333;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            padding-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }
        .header h2 { 
            color: #007bff; 
            margin: 0;
        }
        .class-info {
            font-size: 1.1em;
            color: #666;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        
        /* עיצוב טופס */
        input:not([type="button"]), select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box;
        }
        .btn-primary { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background-color 0.3s;
            width: 100%;
        }
        .btn-primary:hover { 
            background-color: #218838; 
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }

        /* רשימת תלמידים */
        .student-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #eee; 
            padding: 12px 0; 
            font-size: 1.1em;
        }
        .student-row:last-child { 
            border-bottom: none; 
        }
        .student-info { 
            font-weight: 500;
            flex: 1;
        }
        .balance-display { 
            font-weight: bold; 
            color: #007bff;
            margin: 0 15px;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .actions button { 
            padding: 7px 10px; 
            border-radius: 5px; 
            border: none; 
            cursor: pointer; 
            color: white; 
            font-size: 0.9em;
        }
        .btn-plus { background-color: #28a745; }
        .btn-minus { background-color: #ffc107; color: #333; }
        .btn-edit { background-color: #17a2b8; }
        .btn-delete { background-color: #dc3545; }
        
        #message { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center; 
        }
        .msg-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* מודל לעריכת יתרה */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-buttons button {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>מרכז בקרה - מורה 🧑‍🏫</h2>
            <div class="class-info">כיתה: <span id="className"></span></div>
        </div>
        <div class="header-buttons">
            <button onclick="window.location.href='rewards-admin.html'" style="background-color: #ffc107; color: #333;">פרסים 🏆</button>
            <button onclick="window.location.href='shop-admin.html'" style="background-color: #17a2b8;">חנות 🏪</button>
            <button id="backBtn" onclick="backToSuperadmin()" style="background-color: #6c757d; display: none;">חזרה</button>
            <button onclick="logout()" style="background-color: #dc3545;">יציאה</button>
        </div>
    </div>

    <div class="content-grid">
        <div class="card">
            <h3>⚡ הוספת תלמיד חדש</h3>
            <input type="number" id="newId" placeholder="קוד תלמיד (למשל 104)" required>
            <input type="text" id="newName" placeholder="שם מלא של התלמיד" required>
            <input type="number" id="initialBalance" placeholder="יתרה התחלתית (ברירת מחדל: 0)" value="0">
            <button class="btn-primary" onclick="createNewStudent()">צור תלמיד</button>
            <div id="creationMessage"></div>
            
            <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">
            
            <h3>🗑️ מחיקת נתונים</h3>
            <button class="btn-danger" onclick="deleteAllHistory()">מחק את כל ההיסטוריה</button>
            <p style="font-size: 0.85em; color: #666; margin-top: 10px;">פעולה זו תמחק את כל רשומות הקניות מהמערכת</p>
        </div>

        <div class="card">
            <h3>רשימת תלמידים ויתרה</h3>
            <div id="studentsList"></div>
            <div id="loading" style="text-align: center;">טוען נתונים...</div>
        </div>
    </div>

    <!-- מודל לעריכת יתרה -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">עריכת יתרה</div>
            <div id="editStudentName" style="margin-bottom: 15px; color: #666;"></div>
            <input type="number" id="editBalance" placeholder="יתרה חדשה">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">ביטול</button>
                <button class="btn-save" onclick="saveBalance()">שמור</button>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // classId משמש רק לבניית הכתובות. השרת מתעלם ממנו עבור מורה
        // ולוקח את הכיתה מהטוקן, כך שמורה לא יכול לפנות לכיתה אחרת.
        let classId = null;
        let currentEditStudentId = null;

        function backToSuperadmin() {
            sessionStorage.removeItem('activeClassId');
            sessionStorage.removeItem('activeClassName');
            window.location.href = 'superadmin.html';
        }

        function showMessage(elementId, message, isSuccess) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = isSuccess ? 'msg-success' : 'msg-error';
            setTimeout(() => { el.innerHTML = ''; el.className = ''; }, 3000);
        }

        async function createNewStudent() {
            const id = document.getElementById('newId').value;
            const name = document.getElementById('newName').value;
            const balance = document.getElementById('initialBalance').value;
            
            if (!id || !name) {
                showMessage('creationMessage', 'נא למלא קוד ושם תלמיד.', false);
                return;
            }

            const data = await apiPost('/api/students', {
                id, name, balance: parseInt(balance, 10) || 0, classId
            });

            if (data.success) {
                showMessage('creationMessage', data.message, true);
                document.getElementById('newId').value = '';
                document.getElementById('newName').value = '';
                document.getElementById('initialBalance').value = '0';
                loadStudents();
            } else {
                showMessage('creationMessage', data.message, false);
            }
        }

        async function loadStudents() {
            document.getElementById('loading').style.display = 'block';
            const students = await apiJson(`/api/students/${classId}`);
            const list = document.getElementById('studentsList');
            list.innerHTML = '';
            document.getElementById('loading').style.display = 'none';

            if (students.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d;">עדיין אין תלמידים במערכת.</p>';
                return;
            }

            students.forEach(s => {
                const div = document.createElement('div');
                div.className = 'student-row';
                div.innerHTML = `
                    <div class="student-info">
                        ${esc(s.name)} | סיסמה: <strong>${esc(s.id)}</strong>
                    </div>
                    <div class="balance-display">
                        יתרה: <span class="bal">${esc(s.balance)}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-plus">+5</button>
                        <button class="btn-minus">-5</button>
                        <button class="btn-edit">✏️ ערוך</button>
                        <button class="btn-delete">🗑️ מחק</button>
                    </div>
                `;

                // מאזינים במקום onclick מוטמע — שם עם גרש היה שובר את הכפתורים
                const balEl = div.querySelector('.bal');
                const [plusBtn, minusBtn, editBtn, deleteBtn] = div.querySelectorAll('.actions button');
                plusBtn.onclick = () => updateBalance(s.id, 5, balEl);
                minusBtn.onclick = () => updateBalance(s.id, -5, balEl);
                editBtn.onclick = () => openEditModal(s.id, s.name, s.balance, balEl);
                deleteBtn.onclick = () => deleteStudent(s.id, s.name);

                list.appendChild(div);
            });
        }

        async function updateBalance(id, amount, balEl) {
            const data = await apiPost('/api/update-balance', { studentId: id, classId, amount });

            if (data.success) {
                balEl.innerText = data.newBalance;
            } else {
                alert('שגיאה בעדכון היתרה: ' + data.message);
            }
        }

        let currentEditBalanceEl = null;

        function openEditModal(id, name, balance, balEl) {
            currentEditStudentId = id;
            currentEditBalanceEl = balEl;
            document.getElementById('editStudentName').textContent = `תלמיד: ${name}`;
            document.getElementById('editBalance').value = balance;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditStudentId = null;
            currentEditBalanceEl = null;
        }

        async function saveBalance() {
            // parseInt במקום בדיקת truthiness — קודם אי אפשר היה לאפס יתרה ל-0
            const newBalance = parseInt(document.getElementById('editBalance').value, 10);

            if (!Number.isFinite(newBalance) || newBalance < 0) {
                alert('נא להזין יתרה חוקית');
                return;
            }

            const data = await apiPost('/api/set-balance', {
                studentId: currentEditStudentId, classId, balance: newBalance
            });

            if (data.success) {
                if (currentEditBalanceEl) currentEditBalanceEl.innerText = data.newBalance;
                closeEditModal();
            } else {
                alert('שגיאה בעדכון היתרה: ' + data.message);
            }
        }

        async function deleteStudent(id, name) {
            if (!confirm(`האם אתה בטוח שברצונך למחוק את התלמיד "${name}"?\n\nפעולה זו תמחק גם את כל הקניות של התלמיד ולא ניתן לבטל אותה!`)) {
                return;
            }

            const data = await apiJson(`/api/students/${classId}/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            });

            if (data.success) {
                alert(data.message);
                loadStudents();
            } else {
                alert('שגיאה: ' + data.message);
            }
        }

        async function deleteAllHistory() {
            if (!confirm('האם אתה בטוח שברצונך למחוק את כל היסטוריית הקניות?\n\nפעולה זו לא ניתנת לביטול!')) {
                return;
            }

            const data = await apiJson(`/api/purchases/${classId}/all`, { method: 'DELETE' });

            if (data.success) {
                alert(data.message);
            } else {
                alert('שגיאה: ' + data.message);
            }
        }

        (async function init() {
            const session = await loadSession(['teacher', 'superadmin']);
            if (!session) return;

            if (session.role === 'superadmin') {
                classId = sessionStorage.getItem('activeClassId');
                if (!classId) {
                    window.location.href = 'superadmin.html';
                    return;
                }
                document.getElementById('className').textContent = sessionStorage.getItem('activeClassName') || '';
                document.getElementById('backBtn').style.display = 'inline-block';
            } else {
                classId = session.classId;
                document.getElementById('className').textContent = session.className || '';
            }

            loadStudents();
        })();
    </script>
</body>
</html>
