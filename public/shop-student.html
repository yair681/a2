<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חנות הכיתה</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px; 
            min-height: 100vh;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
            color: #667eea;
        }
        .balance-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #28a745;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tab.active {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .product-card.out-of-stock {
            opacity: 0.6;
            background-color: #f8f9fa;
        }
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .product-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .product-description {
            color: #666;
            margin-bottom: 15px;
            min-height: 40px;
        }
        .product-price {
            font-size: 1.5em;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }
        .stock-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .stock-low {
            background-color: #fff3cd;
            color: #856404;
        }
        .stock-out {
            background-color: #f8d7da;
            color: #721c24;
        }
        .stock-ok {
            background-color: #d4edda;
            color: #155724;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-buy {
            background-color: #28a745;
            color: white;
        }
        .btn-buy:hover {
            background-color: #218838;
        }
        .btn-buy:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .purchase-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .purchase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .purchase-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status-pending {
            background-color: #ffc107;
            color: #333;
        }
        .status-approved {
            background-color: #28a745;
            color: white;
        }
        .status-rejected {
            background-color: #dc3545;
            color: white;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .msg-success {
            background-color: #d4edda;
            color: #155724;
        }
        .msg-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .back-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>חנות הכיתה 🛒</h2>
            <div>היתרה שלך: <span id="balanceDisplay" class="balance-display">---</span> נקודות</div>
        </div>
        <button class="back-btn" onclick="window.location.href='student.html'">חזרה לארנק</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('shop')">🛍️ קנה עכשיו</button>
        <button class="tab" onclick="showTab('purchases')">📦 הקניות שלי</button>
    </div>

    <!-- טאב חנות -->
    <div id="shopTab" class="tab-content active">
        <div id="message"></div>
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <!-- טאב קניות -->
    <div id="purchasesTab" class="tab-content">
        <div id="purchasesList"></div>
    </div>

    <script src="common.js"></script>
    <script>
        let classId = null;
        let currentBalance = 0;

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if (tabName === 'shop') {
                document.getElementById('shopTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
                loadProducts();
            } else if (tabName === 'purchases') {
                document.getElementById('purchasesTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
                loadMyPurchases();
            }
        }

        function showMessage(message, isSuccess) {
            const el = document.getElementById('message');
            el.innerHTML = message;
            el.className = 'message ' + (isSuccess ? 'msg-success' : 'msg-error');
            setTimeout(() => { el.innerHTML = ''; el.className = ''; }, 4000);
        }

        async function loadBalance() {
            const data = await apiJson('/api/my-balance');
            const balance = Number(data.balance);
            currentBalance = Number.isFinite(balance) ? balance : 0;
            document.getElementById('balanceDisplay').textContent = currentBalance.toLocaleString('en-US');
        }

        async function loadProducts() {
            const products = await apiJson(`/api/products/${classId}`);
            const grid = document.getElementById('productsGrid');

            if (products.length === 0) {
                grid.innerHTML = '<div style="background: white; padding: 30px; border-radius: 12px; text-align: center; color: #6c757d;">אין עדיין מוצרים בחנות. בקר שוב בהמשך! 🎁</div>';
                return;
            }

            grid.innerHTML = '';
            products.forEach(p => {
                const canAfford = currentBalance >= p.price;
                const inStock = p.stock > 0;
                const canBuy = canAfford && inStock;
                
                const div = document.createElement('div');
                div.className = 'product-card';
                if (!inStock) {
                    div.className += ' out-of-stock';
                }
                
                // הוספת תמונה אם קיימת
                let imageHTML = '';
                if (typeof p.image === 'string' && p.image.startsWith('data:image/')) {
                    imageHTML = `<img src="${esc(p.image)}" class="product-image" alt="${esc(p.name)}">`;
                }
                
                // תג מלאי
                let stockBadge = '';
                if (p.stock === 0) {
                    stockBadge = '<div class="stock-badge stock-out">❌ אזל מהמלאי</div>';
                } else if (p.stock <= 5) {
                    stockBadge = `<div class="stock-badge stock-low">⚠️ נותרו ${p.stock} בלבד!</div>`;
                } else {
                    stockBadge = `<div class="stock-badge stock-ok">✅ במלאי (${p.stock} יחידות)</div>`;
                }
                
                // כפתור קנייה
                let buttonText = '🛒 קנה עכשיו';
                let buttonDisabled = '';
                if (!inStock) {
                    buttonText = '❌ אזל מהמלאי';
                    buttonDisabled = 'disabled';
                } else if (!canAfford) {
                    buttonText = '💰 אין מספיק נקודות';
                    buttonDisabled = 'disabled';
                }
                
                div.innerHTML = `
                    ${imageHTML}
                    <div class="product-name">${esc(p.name)}</div>
                    <div class="product-description">${esc(p.description || 'מוצר נהדר!')}</div>
                    <div class="product-price">${esc(p.price)} נקודות</div>
                    ${stockBadge}
                    <button class="btn btn-buy" ${buttonDisabled}>${buttonText}</button>
                `;

                div.querySelector('.btn-buy').onclick = () => buyProduct(p._id, p.name, p.price);
                grid.appendChild(div);
            });
        }

        async function buyProduct(productId, productName, price) {
            if (!confirm(`האם אתה בטוח שברצונך לרכוש את "${productName}" ב-${price} נקודות?\n\nהקניה תישלח למורה לאישור.`)) {
                return;
            }

            // התלמיד והכיתה נקבעים בשרת לפי הסשן, לא נשלחים מכאן
            const data = await apiPost('/api/purchase', { productId });

            if (data.success) {
                showMessage('✅ ' + data.message + ' תקבל התראה כשהמורה יאשר!', true);
                loadMyPurchases();
            } else {
                showMessage('❌ ' + data.message, false);
            }
        }

        async function loadMyPurchases() {
            const purchases = await apiJson('/api/my-purchases');
            const list = document.getElementById('purchasesList');

            if (purchases.length === 0) {
                list.innerHTML = '<div style="background: white; padding: 30px; border-radius: 12px; text-align: center; color: #6c757d;">עדיין לא בצעת קניות 🛍️</div>';
                return;
            }

            list.innerHTML = '';
            purchases.forEach(p => {
                const div = document.createElement('div');
                div.className = 'purchase-item';
                
                let statusBadge = '';
                let statusText = '';
                if (p.status === 'pending') {
                    statusBadge = '<span class="status-badge status-pending">⏳ ממתין לאישור</span>';
                    statusText = 'הבקשה שלך נשלחה למורה ומחכה לאישור';
                } else if (p.status === 'approved') {
                    statusBadge = '<span class="status-badge status-approved">✓ אושר</span>';
                    statusText = 'הקניה אושרה! תוכל לקבל את המוצר מהמורה';
                } else if (p.status === 'rejected') {
                    statusBadge = '<span class="status-badge status-rejected">✗ נדחה</span>';
                    statusText = 'הקניה נדחתה על ידי המורה';
                }

                div.innerHTML = `
                    <div class="purchase-header">
                        <div class="purchase-name">${esc(p.productName)}</div>
                        ${statusBadge}
                    </div>
                    <div style="color: #666; margin-bottom: 5px;">${statusText}</div>
                    <div style="font-weight: bold; color: #28a745;">${esc(p.price)} נקודות</div>
                    <div style="font-size: 0.9em; color: #999; margin-top: 5px;">
                        תאריך: ${new Date(p.createdAt).toLocaleDateString('he-IL')}
                        ${p.approvedAt ? ' | אושר ב: ' + new Date(p.approvedAt).toLocaleDateString('he-IL') : ''}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        (async function init() {
            const session = await loadSession(['student']);
            if (!session) return;

            classId = session.classId;

            await loadBalance();
            await loadProducts();

            // רענון יתרה וקניות כל 30 שניות
            setInterval(async () => {
                await loadBalance();
                await loadProducts(); // רענון גם של המוצרים כדי לעדכן מלאי
                if (document.getElementById('purchasesTab').classList.contains('active')) {
                    await loadMyPurchases();
                }
            }, 30000);
        })();
    </script>
</body>
</html>
